<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2: Intelligent Shopping Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .products-section, .cart-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .section-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        .product-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 1.1rem;
            color: #059669;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-category {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .quantity-btn {
            background: #e5e7eb;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .quantity-btn:hover {
            background: #d1d5db;
        }

        .quantity-input {
            width: 60px;
            text-align: center;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            padding: 5px;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-to-cart-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .cart-items {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #1f2937;
        }

        .cart-item-details {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 5px;
        }

        .cart-item-price {
            font-weight: 600;
            color: #059669;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cart-quantity-btn {
            background: #e5e7eb;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .remove-item {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .cart-summary {
            padding: 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
        }

        .discount-applied {
            color: #059669;
            font-weight: 600;
        }

        .coupon-section {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .coupon-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .coupon-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
        }

        .apply-coupon-btn {
            padding: 10px 20px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .coupon-message {
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .coupon-valid {
            color: #059669;
        }

        .coupon-invalid {
            color: #ef4444;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            background: #4338ca;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 Intelligent Shopping Cart</h1>
        <p>Smart discounts based on quantity, category, and coupons</p>
    </div>

    <div class="container">
        <!-- Products Section -->
        <div class="products-section">
            <div class="section-header">🛍️ Available Products</div>
            <div class="products-grid" id="productsGrid">
                <!-- Products will be dynamically loaded -->
            </div>
        </div>

        <!-- Cart Section -->
        <div class="cart-section">
            <div class="section-header">🛒 Shopping Cart</div>
            <div class="cart-items" id="cartItems">
                <p style="text-align: center; color: #6b7280; margin: 40px 0;">Your cart is empty</p>
            </div>

            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Discounts:</span>
                    <span id="discounts" class="discount-applied">-$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>

            <div class="coupon-section">
                <div class="coupon-input">
                    <input type="text" id="couponInput" placeholder="Enter coupon code (e.g., SAVE10, BULK5)">
                    <button class="apply-coupon-btn" id="applyCouponBtn">Apply</button>
                </div>
                <div id="couponMessage" class="coupon-message"></div>
            </div>

            <button class="checkout-btn" id="checkoutBtn" disabled>
                Proceed to Checkout
            </button>
        </div>
    </div>

    <script>
        // Product data
        const products = [
            { id: 1, name: "Laptop", price: 999.99, category: "electronics", stock: 10 },
            { id: 2, name: "Smartphone", price: 599.99, category: "electronics", stock: 15 },
            { id: 3, name: "Headphones", price: 149.99, category: "electronics", stock: 20 },
            { id: 4, name: "T-Shirt", price: 19.99, category: "clothing", stock: 50 },
            { id: 5, name: "Jeans", price: 49.99, category: "clothing", stock: 30 },
            { id: 6, name: "Sneakers", price: 89.99, category: "clothing", stock: 25 },
            { id: 7, name: "Coffee Maker", price: 79.99, category: "home", stock: 12 },
            { id: 8, name: "Blender", price: 39.99, category: "home", stock: 18 },
            { id: 9, name: "Bookshelf", price: 129.99, category: "home", stock: 8 },
            { id: 10, name: "Notebook", price: 4.99, category: "stationery", stock: 100 },
            { id: 11, name: "Pen Set", price: 9.99, category: "stationery", stock: 75 },
            { id: 12, name: "Calculator", price: 24.99, category: "stationery", stock: 40 }
        ];

        // Discount rules
        const discountRules = {
            bulk: [
                { minQuantity: 3, discountPercent: 5, description: "5% off 3+ items" },
                { minQuantity: 5, discountPercent: 10, description: "10% off 5+ items" },
                { minQuantity: 10, discountPercent: 15, description: "15% off 10+ items" }
            ],
            category: {
                electronics: { minQuantity: 2, discountPercent: 8, description: "8% off 2+ electronics" },
                clothing: { minQuantity: 3, discountPercent: 12, description: "12% off 3+ clothing items" },
                home: { minQuantity: 2, discountPercent: 6, description: "6% off 2+ home items" },
                stationery: { minQuantity: 5, discountPercent: 15, description: "15% off 5+ stationery items" }
            },
            timeBased: {
                morning: { start: 6, end: 12, discountPercent: 5, description: "5% morning discount" },
                evening: { start: 18, end: 22, discountPercent: 7, description: "7% evening discount" }
            }
        };

        // Coupon codes
        const validCoupons = {
            "SAVE10": { type: "percentage", value: 10, description: "10% off entire order" },
            "SAVE20": { type: "percentage", value: 20, description: "20% off entire order" },
            "BULK5": { type: "fixed", value: 5, description: "$5 off orders over $50" },
            "BULK10": { type: "fixed", value: 10, description: "$10 off orders over $100" },
            "TECH15": { type: "category", value: 15, category: "electronics", description: "15% off electronics" },
            "FASHION20": { type: "category", value: 20, category: "clothing", description: "20% off clothing" }
        };

        // Cart state
        let cart = [];
        let appliedCoupons = [];

        // DOM elements
        const productsGrid = document.getElementById('productsGrid');
        const cartItems = document.getElementById('cartItems');
        const cartSummary = document.getElementById('cartSummary');
        const subtotalEl = document.getElementById('subtotal');
        const discountsEl = document.getElementById('discounts');
        const totalEl = document.getElementById('total');
        const couponInput = document.getElementById('couponInput');
        const applyCouponBtn = document.getElementById('applyCouponBtn');
        const couponMessage = document.getElementById('couponMessage');
        const checkoutBtn = document.getElementById('checkoutBtn');

        // Initialize the application
        function initializeApp() {
            displayProducts();
            setupEventListeners();
            updateCartDisplay();
        }

        // Display products
        function displayProducts() {
            productsGrid.innerHTML = '';

            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';

                productCard.innerHTML = `
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">$${product.price.toFixed(2)}</div>
                    <div class="product-category">${product.category}</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" data-product-id="${product.id}" data-action="decrease">-</button>
                        <input type="number" class="quantity-input" data-product-id="${product.id}" value="1" min="1" max="${product.stock}">
                        <button class="quantity-btn" data-product-id="${product.id}" data-action="increase">+</button>
                    </div>
                    <button class="add-to-cart-btn" data-product-id="${product.id}">Add to Cart</button>
                `;

                productsGrid.appendChild(productCard);
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            // Product quantity controls
            productsGrid.addEventListener('click', handleProductClick);
            productsGrid.addEventListener('input', handleQuantityInput);

            // Coupon application
            applyCouponBtn.addEventListener('click', applyCoupon);

            // Checkout
            checkoutBtn.addEventListener('click', handleCheckout);
        }

        // Handle product clicks (add to cart, quantity buttons)
        function handleProductClick(e) {
            const productId = parseInt(e.target.dataset.productId);
            const action = e.target.dataset.action;

            if (e.target.classList.contains('add-to-cart-btn')) {
                addToCart(productId);
            } else if (action === 'increase') {
                updateProductQuantity(productId, 1);
            } else if (action === 'decrease') {
                updateProductQuantity(productId, -1);
            }
        }

        // Handle quantity input changes
        function handleQuantityInput(e) {
            if (e.target.classList.contains('quantity-input')) {
                const productId = parseInt(e.target.dataset.productId);
                const quantity = parseInt(e.target.value);
                const product = products.find(p => p.id === productId);

                if (quantity > product.stock) {
                    e.target.value = product.stock;
                } else if (quantity < 1) {
                    e.target.value = 1;
                }
            }
        }

        // Update product quantity input
        function updateProductQuantity(productId, change) {
            const input = document.querySelector(`.quantity-input[data-product-id="${productId}"]`);
            const currentValue = parseInt(input.value);
            const newValue = Math.max(1, Math.min(products.find(p => p.id === productId).stock, currentValue + change));
            input.value = newValue;
        }

        // Add item to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const quantityInput = document.querySelector(`.quantity-input[data-product-id="${productId}"]`);
            const quantity = parseInt(quantityInput.value);

            if (quantity > product.stock) {
                alert('Not enough stock available!');
                return;
            }

            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    category: product.category,
                    quantity: quantity
                });
            }

            updateCartDisplay();
        }

        // Remove item from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartDisplay();
        }

        // Update cart item quantity
        function updateCartQuantity(productId, newQuantity) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                if (newQuantity <= 0) {
                    removeFromCart(productId);
                } else {
                    item.quantity = newQuantity;
                    updateCartDisplay();
                }
            }
        }

        // Update cart display
        function updateCartDisplay() {
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #6b7280; margin: 40px 0;">Your cart is empty</p>';
                cartSummary.style.display = 'none';
                checkoutBtn.disabled = true;
                return;
            }

            cartItems.innerHTML = '';
            cart.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';

                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-details">
                            $${item.price.toFixed(2)} each • ${item.category}
                        </div>
                    </div>
                    <div class="cart-item-controls">
                        <div class="cart-quantity">
                            <button class="cart-quantity-btn" data-product-id="${item.id}" data-action="decrease">-</button>
                            <span>${item.quantity}</span>
                            <button class="cart-quantity-btn" data-product-id="${item.id}" data-action="increase">+</button>
                        </div>
                        <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                        <button class="remove-item" data-product-id="${item.id}">Remove</button>
                    </div>
                `;

                cartItems.appendChild(itemDiv);
            });

            // Add event listeners for cart controls
            cartItems.addEventListener('click', handleCartClick);

            calculateTotals();
            cartSummary.style.display = 'block';
            checkoutBtn.disabled = false;
        }

        // Handle cart clicks
        function handleCartClick(e) {
            const productId = parseInt(e.target.dataset.productId);
            const action = e.target.dataset.action;

            if (e.target.classList.contains('remove-item')) {
                removeFromCart(productId);
            } else if (action === 'increase') {
                const item = cart.find(item => item.id === productId);
                updateCartQuantity(productId, item.quantity + 1);
            } else if (action === 'decrease') {
                const item = cart.find(item => item.id === productId);
                updateCartQuantity(productId, item.quantity - 1);
            }
        }

        // Calculate totals with discounts
        function calculateTotals() {
            let subtotal = 0;
            let totalDiscount = 0;

            // Calculate subtotal
            cart.forEach(item => {
                subtotal += item.price * item.quantity;
            });

            // Apply discount rules
            const discounts = calculateDiscounts();

            // Apply coupon discounts
            const couponDiscount = calculateCouponDiscount(subtotal);

            totalDiscount = discounts.total + couponDiscount;

            const total = Math.max(0, subtotal - totalDiscount);

            // Update display
            subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            discountsEl.textContent = `-$${totalDiscount.toFixed(2)}`;
            totalEl.textContent = `$${total.toFixed(2)}`;

            return { subtotal, totalDiscount, total };
        }

        // Calculate automatic discounts
        function calculateDiscounts() {
            let totalDiscount = 0;
            const appliedDiscounts = [];

            // Bulk discounts
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            discountRules.bulk.forEach(rule => {
                if (totalItems >= rule.minQuantity) {
                    const discount = calculateDiscountAmount(rule.discountPercent, 'bulk');
                    totalDiscount += discount;
                    appliedDiscounts.push(rule.description);
                }
            });

            // Category discounts
            Object.entries(discountRules.category).forEach(([category, rule]) => {
                const categoryItems = cart.filter(item => item.category === category);
                const categoryQuantity = categoryItems.reduce((sum, item) => sum + item.quantity, 0);

                if (categoryQuantity >= rule.minQuantity) {
                    const discount = calculateDiscountAmount(rule.discountPercent, 'category', category);
                    totalDiscount += discount;
                    appliedDiscounts.push(rule.description);
                }
            });

            // Time-based discounts
            const currentHour = new Date().getHours();
            Object.values(discountRules.timeBased).forEach(rule => {
                if (currentHour >= rule.start && currentHour < rule.end) {
                    const discount = calculateDiscountAmount(rule.discountPercent, 'time');
                    totalDiscount += discount;
                    appliedDiscounts.push(rule.description);
                }
            });

            return { total: totalDiscount, applied: appliedDiscounts };
        }

        // Calculate discount amount
        function calculateDiscountAmount(percentage, type, category = null) {
            let applicableTotal = 0;

            if (type === 'bulk' || type === 'time') {
                // Apply to entire cart
                applicableTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            } else if (type === 'category' && category) {
                // Apply to specific category
                applicableTotal = cart
                    .filter(item => item.category === category)
                    .reduce((sum, item) => sum + (item.price * item.quantity), 0);
            }

            return applicableTotal * (percentage / 100);
        }

        // Apply coupon code
        function applyCoupon() {
            const couponCode = couponInput.value.trim().toUpperCase();

            if (!couponCode) {
                showCouponMessage('Please enter a coupon code.', 'invalid');
                return;
            }

            // Parse coupon code using string methods
            const parsedCode = parseCouponCode(couponCode);

            if (!parsedCode.valid) {
                showCouponMessage('Invalid coupon code format.', 'invalid');
                return;
            }

            if (appliedCoupons.includes(couponCode)) {
                showCouponMessage('Coupon already applied.', 'invalid');
                return;
            }

            const coupon = validCoupons[couponCode];
            if (!coupon) {
                showCouponMessage('Invalid coupon code.', 'invalid');
                return;
            }

            // Validate coupon conditions
            if (validateCoupon(coupon)) {
                appliedCoupons.push(couponCode);
                couponInput.value = '';
                showCouponMessage(`Coupon applied: ${coupon.description}`, 'valid');
                updateCartDisplay();
            }
        }

        // Parse coupon code using string methods
        function parseCouponCode(code) {
            // Check if code matches expected patterns
            const patterns = {
                percentage: /^SAVE\d+$/,
                fixed: /^BULK\d+$/,
                category: /^(TECH|FASHION)\d+$/
            };

            let type = null;
            let value = null;
            let valid = false;

            for (const [patternType, regex] of Object.entries(patterns)) {
                if (regex.test(code)) {
                    type = patternType;
                    // Extract number from code
                    const match = code.match(/\d+/);
                    if (match) {
                        value = parseInt(match[0]);
                        valid = true;
                    }
                    break;
                }
            }

            return { valid, type, value };
        }

        // Validate coupon conditions
        function validateCoupon(coupon) {
            const totals = calculateTotals();

            switch (coupon.type) {
                case 'fixed':
                    if (coupon.value === 5 && totals.subtotal < 50) {
                        showCouponMessage('Order must be at least $50 for this coupon.', 'invalid');
                        return false;
                    }
                    if (coupon.value === 10 && totals.subtotal < 100) {
                        showCouponMessage('Order must be at least $100 for this coupon.', 'invalid');
                        return false;
                    }
                    break;
                case 'category':
                    const categoryItems = cart.filter(item => item.category === coupon.category);
                    if (categoryItems.length === 0) {
                        showCouponMessage(`No ${coupon.category} items in cart.`, 'invalid');
                        return false;
                    }
                    break;
            }

            return true;
        }

        // Calculate coupon discount
        function calculateCouponDiscount(subtotal) {
            let totalCouponDiscount = 0;

            appliedCoupons.forEach(couponCode => {
                const coupon = validCoupons[couponCode];

                switch (coupon.type) {
                    case 'percentage':
                        totalCouponDiscount += subtotal * (coupon.value / 100);
                        break;
                    case 'fixed':
                        totalCouponDiscount += coupon.value;
                        break;
                    case 'category':
                        const categoryTotal = cart
                            .filter(item => item.category === coupon.category)
                            .reduce((sum, item) => sum + (item.price * item.quantity), 0);
                        totalCouponDiscount += categoryTotal * (coupon.value / 100);
                        break;
                }
            });

            return totalCouponDiscount;
        }

        // Show coupon message
        function showCouponMessage(message, type) {
            couponMessage.textContent = message;
            couponMessage.className = `coupon-message coupon-${type}`;
            setTimeout(() => {
                couponMessage.textContent = '';
                couponMessage.className = 'coupon-message';
            }, 5000);
        }

        // Handle checkout
        function handleCheckout() {
            const totals = calculateTotals();
            alert(`Checkout Summary:
Subtotal: $${totals.subtotal.toFixed(2)}
Discounts: -$${totals.totalDiscount.toFixed(2)}
Total: $${totals.total.toFixed(2)}

Thank you for shopping with us! 🛒`);

            // Reset cart
            cart = [];
            appliedCoupons = [];
            updateCartDisplay();
            couponMessage.textContent = '';
        }

        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
