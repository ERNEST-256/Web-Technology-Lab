<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 10 - React JS Advanced</title>
    <style>
      :root {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #19212b;
        background:
          radial-gradient(circle at top left, #9ad6cb 0%, transparent 30%),
          linear-gradient(135deg, #eefcf8 0%, #dff4ee 48%, #f8fffd 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .hero,
      .exercise-list a {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 24px;
        box-shadow: 0 18px 44px rgba(15, 118, 110, 0.12);
      }

      .hero {
        padding: 32px;
      }

      h1,
      p {
        margin-top: 0;
      }

      .tag {
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.78rem;
        font-weight: 700;
        color: #0f766e;
      }

      .exercise-list {
        display: grid;
        gap: 18px;
        margin-top: 24px;
      }

      .exercise-list a {
        display: block;
        padding: 24px;
        color: inherit;
        text-decoration: none;
        border: 1px solid #99f6e4;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .exercise-list a:hover {
        transform: translateY(-3px);
        box-shadow: 0 22px 46px rgba(13, 148, 136, 0.16);
      }

      .exercise-list strong {
        display: block;
        font-size: 1.2rem;
        color: #115e59;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="tag">Lab 10</p>
        <h1>React JS Advanced</h1>
        <p>Each exercise is available as a separate React website.</p>
      </section>

      <section class="exercise-list">
        <a href="/Ex-1/">
          <strong>Exercise 1</strong>
          Form validation with controlled components using <code>useState</code>.
        </a>
        <a href="/Ex-2/">
          <strong>Exercise 2</strong>
          Dynamic list rendering with add and remove actions.
        </a>
        <a href="/Ex-3/">
          <strong>Exercise 3</strong>
          External API fetching with loading and error handling.
        </a>
      </section>
    </main>
  </body>
</html>
