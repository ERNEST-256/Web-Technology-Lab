<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 Canvas</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f6f7fb;
        color: #111827;
        padding: 24px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 20px;
        color: #4b5563;
      }

      canvas {
        border: 2px solid #111827;
        background: #ffffff;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>HTML5 Canvas</h1>

      <canvas id="myCanvas" width="500" height="300"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      // Filled rectangle
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(50, 50, 120, 80);

      // Filled circle
      ctx.beginPath();
      ctx.arc(300, 90, 40, 0, 2 * Math.PI);
      ctx.fillStyle = "#10b981";
      ctx.fill();

      // Straight line
      ctx.beginPath();
      ctx.moveTo(50, 200);
      ctx.lineTo(450, 200);
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 3;
      ctx.stroke();

      // Text "HTML5 Canvas"
      ctx.fillStyle = "#111827";
      ctx.font = "bold 28px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("HTML5 Canvas", 250, 260);
    </script>
  </body>
</html>
