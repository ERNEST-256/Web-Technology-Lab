<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Registration Form (HTML5)</title>
  </head>
  <body>
    <div class="container">
      <h1>Advanced Registration Form </h1>
      
      <form action="#" method="post" enctype="multipart/form-data">
        <div class="grid">
          <div>
            <label for="fullName">Full Name</label>
            <input
              id="fullName"
              name="fullName"
              type="text"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="row">
            <div>
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div>
              <label for="dob">Date of Birth</label>
              <input id="dob" name="dob" type="date" required />
              <div class="help">Choose your date of birth.</div>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="phone">Phone Number</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                placeholder="e.g., +1 555 123 4567"
                autocomplete="tel"
                inputmode="tel"
                required
              />
              <div class="help">Enter a reachable phone number.</div>
            </div>

            <div>
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <div class="help">Minimum 8 characters.</div>
            </div>
          </div>

          <div>
            <label for="profilePic">Choose Profile Picture</label>
            <input
              id="profilePic"
              name="profilePic"
              type="file"
              accept="image/*"
              required
            />
            <div class="help">Accepted: any image format (JPG/PNG/WebP, etc.).</div>
          </div>

          <div class="terms">
            <input id="terms" name="terms" type="checkbox" required />
            <div>
              <label for="terms">I accept the Terms &amp; Conditions</label>
              <div class="help">
                You must accept before submitting the registration.
              </div>
            </div>
          </div>

          <div class="actions">
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
