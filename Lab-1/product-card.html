<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f6f7fb;
        color: #111827;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      /* Product card styling */
      .product-card {
        width: min(360px, 100%);
        background: #ffffff;
        border: 1px solid #e5e7eb; /* border */
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(17, 24, 39, 0.12); /* box-shadow */
        margin: 12px; /* margin */
      }

      .product-image {
        width: 100%;
        height: 210px;
        object-fit: cover;
        display: block;
      }

      .product-body {
        padding: 16px; /* padding */
      }

      .product-title {
        margin: 0 0 8px;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .product-desc {
        margin: 0 0 14px;
        color: #4b5563;
        font-size: 0.95rem;
        line-height: 1.35;
      }

      .product-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .price {
        font-size: 1.15rem;
        font-weight: 800;
      }

      /* Button styling + hover effects */
      .buy-btn {
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        transition: transform 140ms ease, background-color 140ms ease,
          box-shadow 140ms ease;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
      }

      .buy-btn:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 12px 22px rgba(37, 99, 235, 0.35);
      }

      .buy-btn:active {
        transform: translateY(0);
      }

      .buy-btn:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.35);
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <article class="product-card" aria-label="Product card">
        <img
          class="product-image"
          src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1200&q=60"
          alt="Smart watch on a table"
          loading="lazy"
        />

        <div class="product-body">
          <h2 class="product-title">Smart Watch</h2>
          <p class="product-desc">
            Track your steps, heart rate, and notifications with an all-day battery
            and a comfortable strap.
          </p>

          <div class="product-footer">
            <div class="price">$99.99</div>
            <button class="buy-btn" type="button">Buy Now</button>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
