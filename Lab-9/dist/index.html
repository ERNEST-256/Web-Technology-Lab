<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 9 - React JS Basics</title>
    <style>
      :root {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #1f1f1f;
        background:
          radial-gradient(circle at top right, #ffd7a8 0%, transparent 28%),
          linear-gradient(135deg, #fff7ed 0%, #ffe7d6 50%, #fffcf8 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .hero,
      .exercise-list a {
        background: rgba(255, 255, 255, 0.88);
        border-radius: 24px;
        box-shadow: 0 18px 44px rgba(120, 53, 15, 0.12);
      }

      .hero {
        padding: 32px;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      .tag {
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.78rem;
        font-weight: 700;
        color: #c2410c;
      }

      .exercise-list {
        display: grid;
        gap: 18px;
        margin-top: 24px;
      }

      .exercise-list a {
        display: block;
        padding: 24px;
        color: inherit;
        text-decoration: none;
        border: 1px solid #fed7aa;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .exercise-list a:hover {
        transform: translateY(-3px);
        box-shadow: 0 22px 46px rgba(194, 65, 12, 0.16);
      }

      .exercise-list strong {
        display: block;
        font-size: 1.2rem;
        color: #7c2d12;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="tag">Lab 9</p>
        <h1>React JS Basics</h1>
        <p>Each exercise is now available as a separate React website.</p>
      </section>

      <section class="exercise-list">
        <a href="/Ex-1/">
          <strong>Exercise 1</strong>
          Student profile using JSX and a functional component.
        </a>
        <a href="/Ex-2/">
          <strong>Exercise 2</strong>
          Reusable student cards using props.
        </a>
        <a href="/Ex-3/">
          <strong>Exercise 3</strong>
          Interactive counter using the useState hook.
        </a>
      </section>
    </main>
  </body>
</html>
