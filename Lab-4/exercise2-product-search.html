<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2: AJAX-Based Product Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            padding: 28px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .search-section {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1.2rem;
            pointer-events: none;
        }

        .results-section {
            padding: 0 24px 24px;
            min-height: 120px;
        }

        .state-message {
            text-align: center;
            padding: 32px 16px;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .state-message.loading {
            color: #2563eb;
        }

        .state-message.error {
            color: #dc2626;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 12px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .product-list {
            list-style: none;
        }

        .product-card {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 16px;
            align-items: center;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .product-name {
            font-weight: 600;
            color: #1e293b;
        }

        .product-price {
            font-weight: 700;
            color: #2563eb;
            white-space: nowrap;
        }

        .product-category {
            font-size: 0.875rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .note {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Product Search</h1>
            <p>Live search — results load without page reload</p>
        </div>

        <div class="search-section">
            <div class="search-wrapper">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by name or category..."
                    autocomplete="off"
                    aria-label="Search products"
                >
            </div>
        </div>

        <div class="results-section">
            <div id="resultsState" class="state-message" role="status" aria-live="polite">
                Type to search products
            </div>
            <ul id="productList" class="product-list" style="display: none;"></ul>
        </div>

       
    </div>

    <script>
        (function () {
            const searchInput = document.getElementById('searchInput');
            const resultsState = document.getElementById('resultsState');
            const productList = document.getElementById('productList');

            let debounceTimer = null;
            const DEBOUNCE_MS = 350;

            function setState(message, className) {
                productList.style.display = 'none';
                productList.innerHTML = '';
                resultsState.className = 'state-message' + (className ? ' ' + className : '');
                resultsState.innerHTML = message;
            }

            function setLoading() {
                resultsState.className = 'state-message loading';
                resultsState.innerHTML = '<div class="spinner" aria-hidden="true"></div>Searching...';
                productList.style.display = 'none';
                productList.innerHTML = '';
            }

            function showResults(products) {
                if (!products || products.length === 0) {
                    setState('No results found.', '');
                    return;
                }
                resultsState.style.display = 'none';
                productList.style.display = 'block';
                productList.innerHTML = '';
                products.forEach(function (p) {
                    const li = document.createElement('li');
                    li.className = 'product-card';
                    li.innerHTML =
                        '<span class="product-name">' + escapeHtml(p.name) + '</span>' +
                        '<span class="product-price">$' + formatPrice(p.price) + '</span>' +
                        '<span class="product-category">' + escapeHtml(p.category) + '</span>';
                    productList.appendChild(li);
                });
                resultsState.style.display = 'block';
                resultsState.className = 'state-message';
                resultsState.textContent = products.length + ' result' + (products.length !== 1 ? 's' : '') + ' found';
                resultsState.style.paddingBottom = '8px';
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function formatPrice(n) {
                return Number(n).toFixed(2);
            }

            function runSearch(query) {
                const trimmed = query.trim().toLowerCase();
                if (trimmed.length === 0) {
                    setState('Type to search products', '');
                    return;
                }

                setLoading();

                fetch('products.json')
                    .then(function (res) {
                        if (!res.ok) throw new Error('Request failed');
                        return res.json();
                    })
                    .then(function (data) {
                        const list = data.products || [];
                        const matching = list.filter(function (p) {
                            const name = (p.name || '').toLowerCase();
                            const category = (p.category || '').toLowerCase();
                            return name.indexOf(trimmed) !== -1 || category.indexOf(trimmed) !== -1;
                        });
                        showResults(matching);
                    })
                    .catch(function () {
                        setState('Something went wrong. Check your connection and try again.', 'error');
                    });
            }

            searchInput.addEventListener('input', function () {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function () {
                    debounceTimer = null;
                    runSearch(searchInput.value);
                }, DEBOUNCE_MS);
            });

            searchInput.addEventListener('keydown', function () {
                if (debounceTimer) clearTimeout(debounceTimer);
            });
        })();
    </script>
</body>
</html>
