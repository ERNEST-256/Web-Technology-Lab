<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3: Student Record System (Local JSON)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .header p { opacity: 0.9; font-size: 0.9rem; }

        .form-section {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            align-items: end;
        }

        @media (max-width: 720px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: #374151;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-group input.error { border-color: #dc2626; }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); }
        .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }

        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-secondary:hover { background: #d1d5db; }

        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }

        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        .table-section { padding: 24px; overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #eef2ff;
            font-weight: 600;
            color: #4338ca;
            font-size: 0.875rem;
        }

        tr:hover td { background: #eef2ff; }

        .actions { display: flex; gap: 8px; }

        .message {
            margin: 0 24px 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .message.visible { display: block; }
        .message.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .message.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .empty-state { text-align: center; padding: 40px; color: #6b7280; }

        .note { font-size: 0.75rem; color: #6b7280; text-align: center; padding: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Record System</h1>
            <p>CRUD with Fetch API &amp; response.json() — local JSON</p>
        </div>

        <div class="form-section">
            <form id="studentForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Full name" required>
                    </div>
                    <div class="form-group">
                        <label for="course">Course</label>
                        <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required>
                    </div>
                    <div class="form-group">
                        <label for="marks">Marks</label>
                        <input type="number" id="marks" name="marks" placeholder="0–100" min="0" max="100" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Add Student</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="margin-left: 8px; display: none;">Cancel</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="message" class="message" role="alert"></div>

        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="empty-state">Loading students...</td></tr>
                </tbody>
            </table>
        </div>

        <p class="note">Run from a local server to load <code>students.json</code>.</p>
    </div>

    <script>
        (function () {
            var form = document.getElementById('studentForm');
            var submitBtn = document.getElementById('submitBtn');
            var cancelBtn = document.getElementById('cancelBtn');
            var tableBody = document.getElementById('tableBody');
            var messageEl = document.getElementById('message');
            var nameInput = document.getElementById('name');
            var courseInput = document.getElementById('course');
            var marksInput = document.getElementById('marks');

            var students = [];
            var editingId = null;

            function showMessage(text, isError) {
                messageEl.textContent = text;
                messageEl.className = 'message visible ' + (isError ? 'error' : 'success');
                setTimeout(function () { messageEl.classList.remove('visible'); }, 4000);
            }

            function clearInputErrors() {
                nameInput.classList.remove('error');
                courseInput.classList.remove('error');
                marksInput.classList.remove('error');
            }

            function validateForm() {
                clearInputErrors();
                var name = nameInput.value.trim();
                var course = courseInput.value.trim();
                var marksVal = marksInput.value;
                var marks = parseInt(marksVal, 10);

                if (!name || name.length < 2) {
                    showMessage('Name is required (at least 2 characters).', true);
                    nameInput.classList.add('error');
                    nameInput.focus();
                    return false;
                }
                if (!course || course.length < 2) {
                    showMessage('Course is required (at least 2 characters).', true);
                    courseInput.classList.add('error');
                    courseInput.focus();
                    return false;
                }
                if (marksVal === '' || isNaN(marks) || marks < 0 || marks > 100) {
                    showMessage('Marks must be a number between 0 and 100.', true);
                    marksInput.classList.add('error');
                    marksInput.focus();
                    return false;
                }
                return true;
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function loadStudents() {
                tableBody.innerHTML = '<tr><td colspan="5" class="empty-state">Loading...</td></tr>';
                fetch('students.json')
                    .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function (data) {
                        if (!data || typeof data !== 'object') throw new Error('Invalid JSON structure.');
                        if (!Array.isArray(data.students)) {
                            data.students = [];
                        }
                        students = data.students.slice();
                        renderTable();
                    })
                    .catch(function (err) {
                        var msg = err.message || 'Failed to load students.';
                        if (err instanceof SyntaxError) msg = 'JSON parsing error: invalid students.json.';
                        tableBody.innerHTML = '<tr><td colspan="5" class="empty-state">' + escapeHtml(msg) + '</td></tr>';
                        showMessage(msg, true);
                    });
            }

            function renderTable() {
                if (students.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="empty-state">No students yet. Add one above.</td></tr>';
                    return;
                }
                tableBody.innerHTML = '';
                for (var i = 0; i < students.length; i++) {
                    var s = students[i];
                    var tr = document.createElement('tr');
                    tr.setAttribute('data-id', s.id);
                    tr.innerHTML =
                        '<td>' + escapeHtml(String(s.id)) + '</td>' +
                        '<td>' + escapeHtml(s.name) + '</td>' +
                        '<td>' + escapeHtml(s.course) + '</td>' +
                        '<td>' + escapeHtml(String(s.marks)) + '</td>' +
                        '<td><div class="actions">' +
                        '<button type="button" class="btn btn-secondary btn-sm edit-btn">Edit</button>' +
                        '<button type="button" class="btn btn-danger btn-sm delete-btn">Delete</button>' +
                        '</div></td>';
                    tableBody.appendChild(tr);
                }
                tableBody.querySelectorAll('.edit-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var id = parseInt(btn.closest('tr').getAttribute('data-id'), 10);
                        var s = students.find(function (x) { return x.id === id; });
                        if (s) {
                            editingId = id;
                            nameInput.value = s.name;
                            courseInput.value = s.course;
                            marksInput.value = s.marks;
                            submitBtn.textContent = 'Update Student';
                            cancelBtn.style.display = 'inline-block';
                        }
                    });
                });
                tableBody.querySelectorAll('.delete-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var id = parseInt(btn.closest('tr').getAttribute('data-id'), 10);
                        if (confirm('Delete this student?')) deleteStudent(id);
                    });
                });
            }

            function resetForm() {
                editingId = null;
                form.reset();
                clearInputErrors();
                submitBtn.textContent = 'Add Student';
                cancelBtn.style.display = 'none';
            }

            function nextId() {
                var max = 0;
                for (var i = 0; i < students.length; i++) {
                    if (students[i].id > max) max = students[i].id;
                }
                return max + 1;
            }

            function createStudent() {
                if (!validateForm()) return;
                var student = {
                    id: nextId(),
                    name: nameInput.value.trim(),
                    course: courseInput.value.trim(),
                    marks: parseInt(marksInput.value, 10)
                };
                students.push(student);
                showMessage('Student added successfully.', false);
                renderTable();
                resetForm();
            }

            function updateStudent(id) {
                if (!validateForm()) return;
                var s = students.find(function (x) { return x.id === id; });
                if (!s) {
                    showMessage('Student not found.', true);
                    return;
                }
                s.name = nameInput.value.trim();
                s.course = courseInput.value.trim();
                s.marks = parseInt(marksInput.value, 10);
                showMessage('Student updated successfully.', false);
                renderTable();
                resetForm();
            }

            function deleteStudent(id) {
                var idx = students.findIndex(function (x) { return x.id === id; });
                if (idx === -1) {
                    showMessage('Student not found.', true);
                    return;
                }
                students.splice(idx, 1);
                showMessage('Student deleted successfully.', false);
                renderTable();
                if (editingId === id) resetForm();
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                clearInputErrors();
                if (editingId !== null) {
                    updateStudent(editingId);
                } else {
                    createStudent();
                }
            });

            cancelBtn.addEventListener('click', resetForm);

            loadStudents();
        })();
    </script>
</body>
</html>
