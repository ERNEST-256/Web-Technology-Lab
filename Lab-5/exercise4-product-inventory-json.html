<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4: Product Inventory System (JSON)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b45309 0%, #92400e 100%);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .header p { opacity: 0.9; font-size: 0.9rem; }

        .toolbar {
            padding: 20px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-group label { font-weight: 600; color: #374151; font-size: 0.875rem; }
        .search-group select {
            padding: 8px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            min-width: 160px;
        }

        .form-section {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            align-items: end;
        }

        @media (max-width: 800px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: #374151;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        .form-group input.error { border-color: #dc2626; }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: #d97706; color: white; }
        .btn-primary:hover:not(:disabled) { background: #b45309; transform: translateY(-1px); }
        .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }

        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-secondary:hover { background: #d1d5db; }

        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }

        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        .table-section { padding: 24px; overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #fffbeb;
            font-weight: 600;
            color: #92400e;
            font-size: 0.875rem;
        }

        tr:hover td { background: #fffbeb; }

        tr.low-stock td { background: #fef2f2; }
        tr.low-stock:hover td { background: #fee2e2; }

        .stock-low {
            color: #dc2626;
            font-weight: 700;
        }

        .actions { display: flex; gap: 8px; }

        .message {
            margin: 0 24px 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .message.visible { display: block; }
        .message.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .message.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .empty-state { text-align: center; padding: 40px; color: #6b7280; }

        .note { font-size: 0.75rem; color: #6b7280; text-align: center; padding: 16px; }

        .low-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #fecaca;
            color: #991b1b;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Product Inventory System</h1>
            <p>Manage products with Fetch API — local JSON</p>
        </div>

        <div class="toolbar">
            <div class="search-group">
                <label for="categoryFilter">Filter by category:</label>
                <select id="categoryFilter">
                    <option value="">All categories</option>
                </select>
            </div>
        </div>

        <div class="form-section">
            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productId">Product ID</label>
                        <input type="text" id="productId" name="productId" placeholder="e.g. P001" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Product name" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" name="category" placeholder="e.g. Electronics" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price</label>
                        <input type="number" id="price" name="price" placeholder="0.00" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="stockQuantity">Stock</label>
                        <input type="number" id="stockQuantity" name="stockQuantity" placeholder="0" min="0" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary" id="addBtn">Add Product</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="message" class="message" role="alert"></div>

        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="empty-state">Loading inventory...</td></tr>
                </tbody>
            </table>
        </div>

        <p class="note">Run from a local server to load <code>inventory.json</code>.</p>
    </div>

    <script>
        (function () {
            var LOW_STOCK_THRESHOLD = 5;
            var form = document.getElementById('productForm');
            var tableBody = document.getElementById('tableBody');
            var messageEl = document.getElementById('message');
            var categoryFilter = document.getElementById('categoryFilter');
            var productIdInput = document.getElementById('productId');
            var nameInput = document.getElementById('name');
            var categoryInput = document.getElementById('category');
            var priceInput = document.getElementById('price');
            var stockQuantityInput = document.getElementById('stockQuantity');

            var products = [];

            function showMessage(text, isError) {
                messageEl.textContent = text;
                messageEl.className = 'message visible ' + (isError ? 'error' : 'success');
                setTimeout(function () { messageEl.classList.remove('visible'); }, 4000);
            }

            function clearInputErrors() {
                productIdInput.classList.remove('error');
                nameInput.classList.remove('error');
                categoryInput.classList.remove('error');
                priceInput.classList.remove('error');
                stockQuantityInput.classList.remove('error');
            }

            function validateProduct(pid, name, category, price, stock, skipIdCheck) {
                clearInputErrors();
                if (!pid || pid.trim().length < 1) {
                    showMessage('Product ID is required.', true);
                    productIdInput.classList.add('error');
                    return false;
                }
                if (!skipIdCheck && products.some(function (p) { return p.productId === pid.trim(); })) {
                    showMessage('Product ID already exists.', true);
                    productIdInput.classList.add('error');
                    return false;
                }
                if (!name || name.trim().length < 1) {
                    showMessage('Name is required.', true);
                    nameInput.classList.add('error');
                    return false;
                }
                if (!category || category.trim().length < 1) {
                    showMessage('Category is required.', true);
                    categoryInput.classList.add('error');
                    return false;
                }
                var p = parseFloat(price);
                if (isNaN(p) || p < 0) {
                    showMessage('Price must be a valid number >= 0.', true);
                    priceInput.classList.add('error');
                    return false;
                }
                var s = parseInt(stock, 10);
                if (isNaN(s) || s < 0) {
                    showMessage('Stock must be a valid integer >= 0.', true);
                    stockQuantityInput.classList.add('error');
                    return false;
                }
                return true;
            }

            function getCategories() {
                var set = {};
                products.forEach(function (p) {
                    if (p.category) set[p.category] = true;
                });
                return Object.keys(set).sort();
            }

            function updateCategoryFilter() {
                var cats = getCategories();
                var current = categoryFilter.value;
                categoryFilter.innerHTML = '<option value="">All categories</option>';
                cats.forEach(function (c) {
                    var opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    if (c === current) opt.selected = true;
                    categoryFilter.appendChild(opt);
                });
            }

            function getFilteredProducts() {
                var cat = categoryFilter.value;
                if (!cat) return products;
                return products.filter(function (p) { return p.category === cat; });
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function loadInventory() {
                tableBody.innerHTML = '<tr><td colspan="6" class="empty-state">Loading...</td></tr>';
                fetch('inventory.json')
                    .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function (data) {
                        if (!data || typeof data !== 'object') throw new Error('Invalid JSON structure.');
                        if (!Array.isArray(data.products)) {
                            data.products = [];
                        }
                        products = data.products.slice();
                        products.forEach(function (p) {
                            if (typeof p.price === 'string') p.price = parseFloat(p.price) || 0;
                            if (typeof p.stockQuantity === 'string') p.stockQuantity = parseInt(p.stockQuantity, 10) || 0;
                        });
                        updateCategoryFilter();
                        renderTable();
                    })
                    .catch(function (err) {
                        var msg = err.message || 'Failed to load inventory.';
                        if (err instanceof SyntaxError) msg = 'JSON parsing error: invalid inventory.json.';
                        tableBody.innerHTML = '<tr><td colspan="6" class="empty-state">' + escapeHtml(msg) + '</td></tr>';
                        showMessage(msg, true);
                    });
            }

            function renderTable() {
                var list = getFilteredProducts();
                tableBody.innerHTML = '';
                if (list.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="empty-state">' +
                        (categoryFilter.value ? 'No products in this category.' : 'No products. Add one above.') + '</td></tr>';
                    return;
                }
                list.forEach(function (p) {
                    var tr = document.createElement('tr');
                    var isLow = (p.stockQuantity || 0) <= LOW_STOCK_THRESHOLD;
                    if (isLow) tr.classList.add('low-stock');
                    var stockHtml = String(p.stockQuantity || 0);
                    if (isLow) stockHtml = '<span class="stock-low">' + stockHtml + '</span> <span class="low-badge">LOW</span>';
                    tr.setAttribute('data-product-id', p.productId);
                    tr.innerHTML =
                        '<td>' + escapeHtml(p.productId) + '</td>' +
                        '<td>' + escapeHtml(p.name) + '</td>' +
                        '<td>' + escapeHtml(p.category) + '</td>' +
                        '<td>$' + (Number(p.price || 0).toFixed(2)) + '</td>' +
                        '<td>' + stockHtml + '</td>' +
                        '<td><div class="actions">' +
                        '<button type="button" class="btn btn-secondary btn-sm edit-btn">Edit</button>' +
                        '<button type="button" class="btn btn-danger btn-sm delete-btn">Delete</button>' +
                        '</div></td>';
                    tableBody.appendChild(tr);
                });
                tableBody.querySelectorAll('.edit-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var pid = btn.closest('tr').getAttribute('data-product-id');
                        var p = products.find(function (x) { return x.productId === pid; });
                        if (p) editProduct(p);
                    });
                });
                tableBody.querySelectorAll('.delete-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var pid = btn.closest('tr').getAttribute('data-product-id');
                        if (confirm('Delete this product?')) deleteProduct(pid);
                    });
                });
            }

            function addProduct() {
                var pid = productIdInput.value.trim();
                var name = nameInput.value.trim();
                var category = categoryInput.value.trim();
                var price = priceInput.value;
                var stock = stockQuantityInput.value;
                if (!validateProduct(pid, name, category, price, stock, false)) return;

                products.push({
                    productId: pid,
                    name: name,
                    category: category,
                    price: parseFloat(price),
                    stockQuantity: parseInt(stock, 10)
                });
                showMessage('Product added successfully.', false);
                form.reset();
                updateCategoryFilter();
                renderTable();
            }

            function editProduct(p) {
                var newPrice = prompt('Enter new price:', p.price);
                if (newPrice === null) return;
                var price = parseFloat(newPrice);
                if (isNaN(price) || price < 0) {
                    showMessage('Invalid price.', true);
                    return;
                }
                var newStock = prompt('Enter new stock quantity:', p.stockQuantity);
                if (newStock === null) return;
                var stock = parseInt(newStock, 10);
                if (isNaN(stock) || stock < 0) {
                    showMessage('Invalid stock quantity.', true);
                    return;
                }
                p.price = price;
                p.stockQuantity = stock;
                showMessage('Product updated successfully.', false);
                renderTable();
            }

            function deleteProduct(productId) {
                var idx = products.findIndex(function (p) { return p.productId === productId; });
                if (idx === -1) {
                    showMessage('Product not found.', true);
                    return;
                }
                products.splice(idx, 1);
                showMessage('Product deleted successfully.', false);
                updateCategoryFilter();
                renderTable();
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                addProduct();
            });

            categoryFilter.addEventListener('change', renderTable);

            loadInventory();
        })();
    </script>
</body>
</html>
